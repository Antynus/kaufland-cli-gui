name: Build GUI apps

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths: ["gui/**", "src/**", ".github/workflows/gui.yml"]
  pull_request:
    paths: ["gui/**", "src/**", ".github/workflows/gui.yml"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: apk, os: ubuntu-latest, out: apk }
          - { target: linux, os: ubuntu-latest, out: linux }
          - { target: windows, os: windows-latest, out: windows }
          - { target: macos, os: macos-latest, out: macos }
    defaults:
      run:
        shell: bash
        working-directory: gui
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      FLET_CLI_NO_RICH_OUTPUT: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Linux build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libsecret-1-dev

      - name: Java for Android
        if: matrix.target == 'apk'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Bundle the CLI package into the app
        run: cp -r ../src/kaufland_cli src/

      - name: Install Flet
        run: python -m pip install "flet[all]==1.1.3"

      - name: Build
        run: flet build ${{ matrix.target }} --yes --verbose

      - name: Package
        run: |
          cd build/${{ matrix.out }}
          if [ "${{ matrix.target }}" = "apk" ]; then
            cp *.apk "$GITHUB_WORKSPACE/kaufland-receipts.apk"
          elif [ "${{ matrix.target }}" = "windows" ]; then
            7z a "$GITHUB_WORKSPACE/kaufland-receipts-windows.zip" .
          else
            tar -czf "$GITHUB_WORKSPACE/kaufland-receipts-${{ matrix.target }}.tar.gz" .
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: kaufland-receipts-${{ matrix.target }}
          path: |
            kaufland-receipts*.apk
            kaufland-receipts-*.zip
            kaufland-receipts-*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
