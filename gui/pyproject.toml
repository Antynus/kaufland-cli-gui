[project]
name = "kaufland-receipts"
version = "0.1.0"
description = "Browse and export your Kaufland Card digital receipts"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["flet==1.1.3"]

[dependency-groups]
dev = ["flet[all]==1.1.3"]

[tool.flet]
org = "io.github.kauflandcli"
product = "Kaufland Receipts"
company = "kaufland-cli contributors"
copyright = "MIT licensed. Unofficial, not affiliated with Kaufland."

[tool.flet.app]
path = "src"
module = "main"

[tool.flet.android]
adaptive_icon_background = "#7C3AED"
