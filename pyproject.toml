[project]
name = "slip-invoice-checker"
version = "0.2.0"
description = "Collect and check shopping receipts: Kaufland, Lidl Plus and Croatian fiscal slips"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["receipts", "fiscal", "croatia", "kaufland", "lidl", "loyalty", "cli"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = []

[project.scripts]
slip = "slip_checker.cli:main"
kaufland = "slip_checker.cli:kaufland_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slip_checker"]

[tool.ruff]
line-length = 110
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
